name: EnergyHub
version: "0.3.0"
slug: energyhub
description: Control y estimación del consumo eléctrico del hogar, por aparato y por tramo horario.
url: https://github.com/merchedev/EnergyHub
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:lightning-bolt
panel_title: EnergyHub
panel_admin: false
homeassistant_api: true
hassio_api: true
auth_api: true
options:
  demo_mode: false
  log_level: info
schema:
  demo_mode: bool
  log_level: list(debug|info|warning|error)
